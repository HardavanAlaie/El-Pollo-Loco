<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Drawable & Movable -->
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>

    <!-- Character und Gegner -->
    <script src="models/character.class.js"></script>
    <script src="models/chicken-small.class.js"></script>
    <script src="models/chicken-normal.class.js"></script>
    <script src="models/endboss-level1.class.js"></script>
    <script src="models/endboss-level2.class.js"></script>

    <!-- Collectables -->
    <script src="models/collectable-bottle.class.js"></script>
    <script src="models/collectable-coin.class.js"></script>

    <!-- UI Elemente -->
    <script src="models/status-bar.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-enemy.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>

    <!-- Umgebung -->
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>

    <!-- Steuerung -->
    <script src="models/keyboard.class.js"></script>
    <script src="models/throwable-object.class.js"></script>

    <!-- Level-Logik -->
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/all-levels.class.js"></script>

    <!-- Welt und Spiel -->
    <script src="models/world.class.js"></script>
    <script src="js/game.js" defer></script>
  </head>

  <body>
    <div id="start-screen">
      <!-- <h1>Willkommen zum Spiel!</h1> -->
      <button onclick="startGame()">Start</button>
      <button onclick="showInstructions()">📖 Anleitung</button>
    </div>

    <!-- Anleitung Overlay -->
    <div id="instructions-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Bedienungsanleitung</h2>
        <ul>
          <li>⬅️ / ➡️ – Bewegung</li>
          <li>🟢 – Springen (Pfeiltaste ↑)</li>
          <li>🧪 – Flasche werfen (Taste D)</li>
          <li>🔊 – Sound ein/aus</li>
          <li>🖥️ – Vollbild ein/aus</li>
        </ul>
        <button onclick="hideInstructions()">Schließen</button>
      </div>
    </div>

    <!-- Mobile Gamepad-Steuerung -->
    <div id="mobile-controls">
      <div class="left-controls">
        <button id="left-btn">⬅️</button>
        <button id="right-btn">➡️</button>
      </div>
      <div class="right-controls">
        <button id="jump-btn">🟢</button>
        <button id="throw-btn">🧪</button>
      </div>
    </div>

    <h1 class="h1">El Pollo Loco</h1>
    <canvas id="canvas" width="720" height="480"></canvas>
    <!-- <div id="gameContainer">
      <canvas id="gameCanvas" width="720" height="480"></canvas>
    </div> -->

    <div id="canvas-buttons">
      <button id="fullscreen-btn" title="Vollbild">🖥️</button>
      <button id="sound-btn" title="Sound">🔊</button>
    </div>
  </body>
</html>
